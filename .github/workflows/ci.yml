name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned (not ubuntu-latest) so the image only changes when we choose: the
# integration tests download a MongoDB server binary built for this Ubuntu release.
jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The integration tests start a real MongoDB replica set; cache its binary.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Tests with coverage
        run: npm run test:coverage
      - name: OpenAPI document is up to date
        run: |
          npm run docs:openapi -w @bbms/backend
          git diff --exit-code -- docs/openapi.json
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            backend/coverage
            frontend/coverage
            packages/shared/coverage
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Production dependencies must be clean; dev tooling is reported but not blocking below high.
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=high

  docker:
    name: Container images build
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: digirakt-api:ci
      - name: Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: digirakt-web:ci
